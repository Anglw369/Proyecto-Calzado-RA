<body>
    <section id="view-home" class="view active">
        <div class="content-wrapper">
            <h1 class="uni-title">Sistema de Pasarela Virtual</h1>
            <p class="uni-subtitle">Tecnológica de León - División de Entornos Virtuales</p>
            <div class="actions">
                <button class="btn-main" onclick="navigateTo('view-login')">Ingresar al Sistema</button>
            </div>
        </div>
    </section>

    <section id="view-login" class="view">
        <div class="form-container">
            <h2>Inicio de Sesión</h2>
            <form id="login-form">
                <input type="email" placeholder="Correo institucional" required>
                <input type="password" placeholder="Contraseña" required>
                <button type="button" class="btn-main" onclick="navigateTo('view-app')">Entrar</button>
            </form>
        </div>
    </section>

    <section id="view-app" class="view">
        <div id="camera-viewport">
            <video id="webcam" autoplay playsinline></video>
        </div>
        <div id="ui-controls">
            <button class="nav-btn">Modelos</button>
            <button class="nav-btn">Personalizar</button>
            <button class="nav-btn">Guardar</button>
        </div>
    </section>

    <script src="js/navigation.js"></script>
</body>
