<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>StepRA - Bienvenidos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://static.balsamiq.com/prototype/v1/js/tailwindcss-3.4.17.js"></script>
    <script defer src="https://static.balsamiq.com/prototype/v1/js/alpinejs-3.14.9.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a58ca",
                        "dark-calzado": "#0b1b3d",
                        "background": "#f3ede0",
                        "surface": "#f8f5ee"
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-background text-dark-calzado antialiased min-h-screen"
      x-data="{ isLoggedIn: localStorage.getItem('stepra_session') === 'active' }">

    <!-- HEADER DINÁMICO RECONECTADO -->
    <header class="w-full bg-white border-b border-gray-300 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="text-xl font-bold uppercase tracking-wider">
                <a href="index.html"><span>Step</span><span class="text-primary">RA</span></a>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- Estado 1: El usuario NO ha iniciado sesión -->
                <a x-show="!isLoggedIn" x-cloak href="login.html" class="bg-primary text-white px-6 py-2 rounded-xl font-bold shadow hover:opacity-90 transition-all inline-block text-sm">
                    Iniciar Sesión
                </a>
                
                <!-- Estado 2: El usuario SÍ está autenticado (Sincronizado con app.html) -->
                <button x-show="isLoggedIn" x-cloak 
                        onclick="localStorage.setItem('stepra_subpage', 'catalog'); window.location.href='perfil.html';" 
                        class="bg-primary text-white px-5 py-2 rounded-xl font-bold shadow hover:opacity-90 transition-all flex items-center gap-1.5 text-sm">
                    <i class="fa-solid fa-shoe-prints"></i> Perfil
                </button>
                
                <button x-show="isLoggedIn" x-cloak 
                        onclick="if(typeof window.cerrarSesionUsuario === 'function') { window.cerrarSesionUsuario(); } else { localStorage.clear(); sessionStorage.clear(); window.location.reload(); }" 
                        class="border-2 border-red-600 text-red-600 px-4 py-1.5 rounded-xl font-bold text-xs hover:bg-red-50 transition-all uppercase tracking-wider">
                    Salir
                </button>
            </div>
        </div>
    </header>

    <!-- CUERPO PRINCIPAL INTERACTIVO -->
    <main class="flex flex-col items-center justify-center text-center px-4 py-24 gap-6 max-w-4xl mx-auto">
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight leading-tight">
            Visualiza el futuro de tu calzado
        </h1>
        <p class="text-base md:text-lg text-gray-600 max-w-2xl">
            Proyecto de estadías enfocado en la implementación de Realidad Aumentada interactiva para el sector calzado.
        </p>
        
        <div class="mt-4">
            <!-- Botón de acceso directo rápido -->
            <button onclick="localStorage.setItem('stepra_subpage', 'catalog'); window.location.href='app.html';" 
                    class="bg-primary text-white px-10 py-4 rounded-xl text-lg font-black shadow-lg hover:opacity-95 transition-all inline-block tracking-wide active:scale-95">
                Ingresar a la Plataforma 👟
            </button>
        </div>
    </main>

    <!-- TRUCO MAESTRO: Importamos la lógica de autenticación para que reconozca a Supabase y al cerrar sesión limpie todo -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
