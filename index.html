<body>
    <section id="view-home" class="view active">
        <div class="overlay">
            <div id="brand-logo">OBIPARKER <span class="accent">RA</span></div>
            <h1>Pasarela Virtual de Calzado</h1>
            <p>Prueba, personaliza y camina hacia el futuro.</p>
            <div class="home-actions">
                <button class="primary-btn" onclick="navigateTo('view-login')">Comenzar</button>
            </div>
        </div>
    </section>

    <section id="view-login" class="view">
        <div class="login-container">
            <h2>Bienvenido</h2>
            <p>Inicia sesión para guardar tus diseños</p>
            <input type="email" placeholder="Correo electrónico" id="email">
            <input type="password" placeholder="Contraseña" id="password">
            <button class="primary-btn" onclick="navigateTo('view-app')">Entrar</button>
            <span class="link-text">¿No tienes cuenta? Regístrate</span>
        </div>
    </section>

    <section id="view-app" class="view">
        <div id="camera-container">
            <video id="webcam" autoplay playsinline></video>
        </div>
        <div id="controls-panel">
            <button class="action-btn">Modelo</button>
            <button class="action-btn">Color</button>
            <button class="action-btn" onclick="guardarCaptura()">Guardar</button>
        </div>
    </section>

    <script src="js/navigation.js"></script>
    <script src="js/main.js"></script>
</body>
