<body>
    <div id="view-home" class="screen active">
        <div class="hero">
            <h1>Pasarela Virtual UTL</h1>
            <p>Mide tu pie y prueba calzado en RA</p>
            <button onclick="showScreen('view-auth')">Comenzar</button>
        </div>
    </div>

    <div id="view-auth" class="screen">
        <div class="auth-box">
            <h2>Ingresa al Sistema</h2>
            <input type="email" id="email" placeholder="Correo">
            <input type="password" id="pass" placeholder="Contraseña">
            <button onclick="showScreen('view-scanner')">Entrar</button>
        </div>
    </div>

    <div id="view-scanner" class="screen">
        <div id="camera-wrap">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output-canvas"></canvas> 
        </div>
        <div id="measurement-panel">
            <p>Largo: <span id="val-largo">0</span> cm</p>
            <p>Ancho: <span id="val-ancho">0</span> cm</p>
            <button onclick="showScreen('view-probador')">Ir al Probador</button>
        </div>
    </div>

    <div id="view-probador" class="screen">
        <div id="ar-viewer"></div>
        <div class="controls-row">
            <button class="btn">Modelo</button>
            <button class="btn">Color</button>
            <button class="btn" onclick="saveResult()">Guardar</button>
        </div>
    </div>
</body>
