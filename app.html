<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pasarela Virtual - StepRA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/main.css?v=15">
</head>
<body>

    <div class="app-container">
        <nav class="navbar">
            <a href="index.html" class="logo-link">
                <div class="logo">Step<span>RA</span></div>
            </a>
            <button class="btn-logout" onclick="cerrarSesionUsuario()" title="Cerrar Sesión">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </nav>

        <div id="camera-container">
            <video id="webcam" autoplay playsinline></video>

            <div id="simulation-overlay" class="hidden">
                <h3>Escáner Pasarela</h3>
                <div class="sim-data">Modelo: <span id="view-modelo">Cubo 3D (Tenis)</span></div>
                <div class="sim-data">Color: <span><span id="view-color-name">Azul Sport</span> <div id="color-preview" style="background-color: #0A58CA;"></div></span></div>
                <div class="sim-data">Talla Estimada: <span id="view-talla">Por medir...</span></div>
            </div>

            <button id="btn-medir-flotante" class="action-btn hidden" onclick="simularMedicionIA()">
                <i class="fa-solid fa-ruler-combined"></i> Calibrar Medida (IA)
            </button>
        </div>

        <div id="controls-panel">
            <button class="action-btn" onclick="intercambiarModelo()">
                <i class="fa-solid fa-shoe-prints" style="display:block; margin-bottom:4px; font-size:14px;"></i> Modelo
            </button>
            <button class="action-btn" onclick="intercambiarColor()">
                <i class="fa-solid fa-palette" style="display:block; margin-bottom:4px; font-size:14px;"></i> Color
            </button>
            <button class="action-btn btn-save" onclick="guardarConfiguracionActual()">Guardar</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module" src="js/auth.js"></script>
    <script src="js/controllers.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
