<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara - Pasarela Virtual</title>
    <link rel="stylesheet" href="css/main.css">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

    <style>
        /* Ajuste rápido para superponer el zapato sobre la cámara */
        #camera-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            height: 480px;
            margin: 0 auto;
            background: #000;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #shoe-viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            --poster-color: transparent; /* Quita el fondo por defecto */
            background-color: transparent;
        }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="webcam" autoplay playsinline></video>

        <model-viewer id="shoe-viewer" 
            src="models/zapato_base.glb" 
            alt="Modelo 3D de Calzado"
            camera-controls
            interaction-prompt="none"
            shadow-intensity="1">
        </model-viewer>
    </div>

    <div id="controls-panel">
        <button class="action-btn" onclick="intercambiarModelo()">Cambio de modelo</button>
        <button class="action-btn" onclick="intercambiarColor()">Cambio de color</button>
        <button class="action-btn" onclick="guardarConfiguracionActual()">Guardar</button>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script src="js/controllers.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
