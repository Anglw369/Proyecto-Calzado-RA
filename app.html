<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>StepRA - Panel de Aplicación</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://static.balsamiq.com/prototype/v1/css/material-symbols-outlined.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/main.css?v=31">

    <script src="https://static.balsamiq.com/prototype/v1/js/tailwindcss-3.4.17.js"></script>
    <script defer src="https://static.balsamiq.com/prototype/v1/js/alpinejs-3.14.9.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a58ca",
                        "dark-calzado": "#0b1b3d",
                        "background": "#f3ede0",
                        "surface": "#f8f5ee",
                        "accent-light": "#ffd166"
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .modal-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 27, 61, 0.75); backdrop-filter: blur(4px);
            z-index: 9999 !important; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body class="bg-[#e6dfd3] text-dark-calzado antialiased min-h-screen" 
      x-data="{ subPage: 'catalog', isLoggedIn: localStorage.getItem('stepra_session') === 'active', selectedProduct: null, openProductModal: false, selectedTalla: '26.0', selectedColor: '#0A58CA' }">

  <div x-show="subPage === 'catalog'" x-cloak class="min-h-screen flex flex-col bg-background">
    <header class="w-full bg-white border-b border-gray-300 sticky top-0 z-50 px-4 py-4 flex items-center justify-between">
      <div class="text-xl font-bold"><a href="index.html"><span>Step</span><span class="text-primary">RA</span></a></div>
      <div class="flex items-center gap-4">
        <span class="text-xs font-bold bg-green-100 px-3 py-1 rounded text-green-800" x-show="isLoggedIn">Sesión Iniciada</span>
        <span class="text-xs font-bold bg-amber-100 px-3 py-1 rounded text-amber-800" x-show="!isLoggedIn">Modo Invitado</span>
        <button onclick="window.location.href='index.html'" class="text-gray-500"><span class="material-symbols-outlined text-2xl">home</span></button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
      <h2 class="text-2xl font-bold mb-6 text-center">Modelados Disponibles</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 justify-items-center">
        
        <div class="bg-white rounded-lg shadow border border-gray-300 overflow-hidden flex flex-col w-full max-w-sm cursor-pointer hover:shadow-md"
             @click="selectedProduct = { id: 'cubo', name: 'Cubo 3D (Tenis)', desc: 'Modelado plano calibrado para simulación de tenis deportivo.' }; openProductModal = true">
          <div class="h-44 bg-blue-50 flex items-center justify-center text-5xl">📦</div>
          <div class="p-6 bg-surface">
            <h3 class="text-xl font-bold">Cubo 3D (Tenis)</h3>
            <span class="text-lg font-bold text-primary mt-2 block">$150.00 MXN</span>
          </div>
        </div>

        <div class="bg-white rounded-lg shadow border border-gray-300 overflow-hidden flex flex-col w-full max-w-sm cursor-pointer hover:shadow-md"
             @click="selectedProduct = { id: 'cilindro', name: 'Cilindro 3D (Bota)', desc: 'Modelado alto calibrado para simulación de botas o calzado de caña alta.' }; openProductModal = true">
          <div class="h-44 bg-amber-50 flex items-center justify-center text-5xl">🛢️</div>
          <div class="p-6 bg-surface">
            <h3 class="text-xl font-bold">Cilindro 3D (Bota)</h3>
            <span class="text-lg font-bold text-primary mt-2 block">$180.00 MXN</span>
          </div>
        </div>

      </div>
    </main>

    <div x-show="openProductModal" x-cloak class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-lg p-6 w-full max-w-md border border-gray-400 relative flex flex-col gap-4" @click.away="openProductModal = false">
        <button class="absolute top-4 right-4 text-gray-500 font-bold" @click="openProductModal = false">✕</button>
        <h3 class="text-2xl font-bold" x-text="selectedProduct?.name"></h3>
        <p class="text-sm text-gray-600" x-text="selectedProduct?.desc"></p>
        
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">Talla base:</label>
          <select x-model="selectedTalla" class="w-full border p-2 rounded bg-gray-50 font-bold text-primary">
            <option value="24.0">24.0 MX</option>
            <option value="25.0">25.0 MX</option>
            <option value="26.0">26.0 MX</option>
            <option value="27.0">27.0 MX</option>
            <option value="28.0">28.0 MX</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Color Inicial:</label>
          <div class="flex gap-4 justify-center">
            <button @click="selectedColor = '#0A58CA'" :class="selectedColor === '#0A58CA' ? 'ring-4 ring-primary' : ''" class="w-10 h-10 rounded-full bg-[#0A58CA] border"></button>
            <button @click="selectedColor = '#DC3545'" :class="selectedColor === '#DC3545' ? 'ring-4 ring-primary' : ''" class="w-10 h-10 rounded-full bg-[#DC3545] border"></button>
            <button @click="selectedColor = '#198754'" :class="selectedColor === '#198754' ? 'ring-4 ring-primary' : ''" class="w-10 h-10 rounded-full bg-[#198754] border"></button>
          </div>
        </div>

        <button @click="openProductModal = false; subPage = 'ar_view'; window.seleccionarObjetoDesdeCatalogo(selectedProduct.id, selectedColor, selectedTalla);" 
                class="w-full bg-primary text-white py-3 rounded font-bold text-lg shadow hover:opacity-90 transition-all">
          Probar en mi Pie 👟
        </button>
      </div>
    </div>
  </div>

  <div x-show="subPage === 'ar_view'" x-cloak class="min-h-screen bg-black/95 flex flex-col justify-between">
    
    <div id="camera-container" class="relative flex-1 w-full bg-black overflow-hidden">
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>

        <div id="menu-modelos-visual" class="modal-container" style="display: none;">
            <div class="modal-box">
                <h4>Selecciona el Tipo de Calzado</h4>
                <div class="options-wrapper">
                    <div class="option-button cursor-pointer" onclick="cambiarGeometriaTacto('cubo', 'Cubo 3D (Tenis)')">
                        <i class="fa-solid fa-shoe-prints"></i>
                        <span>Cubo 3D<br>(Tenis)</span>
                    </div>
                    <div class="option-button cursor-pointer" onclick="cambiarGeometriaTacto('cilindro', 'Cilindro 3D (Bota)')">
                        <i class="fa-solid fa-boot"></i>
                        <span>Cilindro 3D<br>(Bota)</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="simulation-overlay" class="absolute top-2 left-2 right-2 bg-white/90 backdrop-blur px-3 py-1.5 rounded shadow z-10 grid grid-cols-3 gap-2 items-center">
            <h3 class="col-span-3 text-[9px] font-black tracking-wider uppercase text-primary text-center border-b pb-0.5 border-blue-200">Escáner Pasarela</h3>
            <div class="flex flex-col items-center text-[11px] border-r border-gray-300 pr-1">
                <span class="text-[9px] text-gray-400 font-bold uppercase">Modelo</span>
                <span id="view-modelo" class="font-bold truncate max-w-[80px]">Cubo 3D</span>
            </div>
            <div class="flex flex-col items-center text-[11px] border-r border-gray-300 pr-1">
                <span class="text-[9px] text-gray-400 font-bold uppercase">Color</span>
                <span class="font-bold flex items-center gap-1"><span id="view-color-name">Azul</span><div id="color-preview" class="w-2.5 h-2.5 rounded-full border border-black" style="background-color: #0A58CA;"></div></span>
            </div>
            <div class="flex flex-col items-center text-[11px]">
                <span class="text-[9px] text-gray-400 font-bold uppercase">Talla Estimada</span>
                <span id="view-talla" class="font-bold text-blue-700">Por medir...</span>
            </div>
        </div>

        <button id="btn-medir-flotante" class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-accent-light text-dark-calzado border-2 border-white px-6 py-2.5 rounded-full text-xs font-black shadow-2xl z-20 whitespace-nowrap" onclick="simularMedicionIA()">
            <i class="fa-solid fa-ruler-combined"></i> Calibrar Medida (IA)
        </button>
    </div>

    <div id="debug-tools-panel" class="hidden bg-white p-4 border-t border-gray-300 flex items-center gap-3 z-30">
        <span class="text-[10px] font-black text-dark-calzado uppercase whitespace-nowrap">📏 Talla Manual:</span>
        <input type="range" id="size-slider" min="22.0" max="30.0" step="0.5" value="26.0" class="flex-1 accent-primary h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" oninput="ajustarTallaManual(this.value)">
    </div>

    <input type="color" id="color-picker" value="#0A58CA" class="hidden" onchange="seleccionarColorManual(this.value)">

    <div class="bg-white p-4 grid grid-cols-2 gap-3 border-t border-gray-300 z-30">
        <button class="bg-[#f3ede0] border border-gray-300 py-3 rounded-xl text-xs font-bold uppercase" onclick="intercambiarModelo()">
            <i class="fa-solid fa-shoe-prints block mb-1 text-sm text-primary text-center"></i> Modelo
        </button>
        <button class="bg-[#f3ede0] border border-gray-300 py-3 rounded-xl text-xs font-bold uppercase" onclick="intercambiarColor()">
            <i class="fa-solid fa-palette block mb-1 text-sm text-primary text-center"></i> Color
        </button>
        
        <button class="col-span-2 bg-primary text-white py-4 rounded-xl font-black text-sm uppercase tracking-wider shadow-md" 
                @click="if(!isLoggedIn) { alert('🔒 [AUTENTICACIÓN REQUERIDA]\n\nPara guardar tu configuración en Supabase debes iniciar sesión.'); window.location.href = 'login.html'; } else { guardarConfiguracionActual(); }">
            Guardar Configuración
        </button>
        <button @click="subPage = 'catalog'" class="col-span-2 text-center text-xs font-bold text-gray-500 uppercase mt-1">✕ Volver al Catálogo</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <script type="module" src="js/auth.js"></script>
  <script src="js/controllers.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
