<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara - Pasarela Virtual</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div id="camera-container">
        <video id="webcam" autoplay playsinline></video>

        <div id="simulation-overlay">
            <h3>RA Calzado (Simulación)</h3>
            <div class="sim-data">Modelo: <span id="view-modelo">Deportivo Alpha</span></div>
            <div class="sim-data">Color: <span><span id="view-color-name">Blanco</span> <div id="color-preview"></div></span></div>
            <div class="sim-data">Talla Estimada: <span id="view-talla">Por medir...</span></div>
        </div>
    </div>

    <div id="controls-panel">
        <button class="action-btn" onclick="intercambiarModelo()">Cambio de modelo</button>
        <button class="action-btn" onclick="intercambiarColor()">Cambio de color</button>
        <button class="action-btn" onclick="simularMedicionIA()">Medir Pie (IA)</button>
        <button class="action-btn btn-save" onclick="guardarConfiguracionActual()">Guardar Configuración</button>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script src="js/controllers.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
