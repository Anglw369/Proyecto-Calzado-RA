<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pasarela Virtual - StepRA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/main.css?v=25">
    <style>
        /* Panel selector visual de modelos (Grisalla Táctil) */
        .modal-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 27, 61, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 9999 !important; /* Prioridad máxima sobre Three.js */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-box {
            background: var(--surface);
            padding: 24px;
            border-radius: 20px;
            width: 85%;
            max-width: 340px;
            border: 2px solid var(--border-color);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .modal-box h4 {
            font-size: 13px;
            font-weight: 800;
            color: var(--dark-calzado);
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .options-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .option-button {
            background: var(--bg-warm);
            border: 1px solid var(--border-color);
            padding: 20px 10px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .option-button i {
            font-size: 28px;
            color: var(--primary-warm);
        }
        .option-button span {
            font-size: 11px;
            font-weight: 700;
            color: var(--dark-calzado);
            text-transform: uppercase;
        }
        /* Comportamiento táctil en móviles */
        .option-button:active {
            background: var(--accent-light);
            transform: scale(0.95);
            border-color: var(--accent-light);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <nav class="navbar">
            <a href="index.html" class="logo-link">
                <div class="logo">Step<span>RA</span></div>
            </a>
            <button class="btn-logout" onclick="cerrarSesionUsuario()" title="Cerrar Sesión">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </nav>

        <div id="camera-container">
            <video id="webcam" autoplay playsinline></video>

            <div id="menu-modelos-visual" class="modal-container" style="display: none;">
                <div class="modal-box">
                    <h4>Selecciona el Tipo de Calzado</h4>
                    <div class="options-wrapper">
                        <div class="option-button" onclick="cambiarGeometriaTacto('cubo', 'Cubo 3D (Tenis)')">
                            <i class="fa-solid fa-shoe-prints"></i>
                            <span>Cubo 3D<br>(Tenis)</span>
                        </div>
                        <div class="option-button" onclick="cambiarGeometriaTacto('cilindro', 'Cilindro 3D (Bota)')">
                            <i class="fa-solid fa-boot"></i>
                            <span>Cilindro 3D<br>(Bota)</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="simulation-overlay" class="hidden">
                <h3>Escáner Pasarela</h3>
                <div class="sim-data">Modelo: <span id="view-modelo">Cubo 3D (Tenis)</span></div>
                <div class="sim-data">Color: <span><span id="view-color-name">Azul Sport</span> <div id="color-preview" style="background-color: #0A58CA;"></div></span></div>
                <div class="sim-data">Talla Estimada: <span id="view-talla">Por medir...</span></div>
            </div>

            <button id="btn-medir-flotante" class="action-btn hidden" onclick="simularMedicionIA()">
                <i class="fa-solid fa-ruler-combined"></i> Calibrar Medida (IA)
            </button>
        </div>

        <div id="debug-tools-panel" class="hidden" style="background: var(--surface); padding: 14px 16px; border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 10px; font-weight: 800; color: var(--dark-calzado); text-transform: uppercase; white-space: nowrap;">📏 Talla Manual:</span>
            <input type="range" id="size-slider" min="22.0" max="30.0" step="0.5" value="26.0" style="margin: 0; flex: 1; accent-color: var(--primary-warm);" oninput="ajustarTallaManual(this.value)">
        </div>

        <input type="color" id="color-picker" value="#0A58CA" style="display: none;" onchange="seleccionarColorManual(this.value)">

        <div id="controls-panel" style="border-top: 1px solid var(--border-color);">
            <button class="action-btn" onclick="intercambiarModelo()">
                <i class="fa-solid fa-shoe-prints" style="display:block; margin-bottom:4px; font-size:14px;"></i> Modelo
            </button>
            <button class="action-btn" onclick="intercambiarColor()">
                <i class="fa-solid fa-palette" style="display:block; margin-bottom:4px; font-size:14px;"></i> Color
            </button>
            <button class="action-btn btn-save" onclick="guardarConfiguracionActual()">Guardar</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script src="js/controllers.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
