<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>StepRA - Catálogo y Perfil</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://static.balsamiq.com/prototype/v1/css/material-symbols-outlined.css" rel="stylesheet"/>

    <script src="https://static.balsamiq.com/prototype/v1/js/tailwindcss-3.4.17.js"></script>
    <script defer src="https://static.balsamiq.com/prototype/v1/js/alpinejs-3.14.9.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a58ca",
                        "dark-calzado": "#0b1b3d",
                        "background": "#f3ede0",
                        "surface": "#f8f5ee",
                        "accent-light": "#ffd166"
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-[#e6dfd3] text-dark-calzado antialiased min-h-screen flex flex-col" 
      x-data="{ isLoggedIn: localStorage.getItem('stepra_session') === 'active', openProfile: false, selectedProduct: null, openProductModal: false, selectedTalla: '26.0', selectedColor: '#0A58CA', historial: { modelo: 'Ninguno', color: 'Ninguno', talla: '0.0' } }"
      x-init="if(isLoggedIn) { 
          // Simulamos la carga de datos guardados desde Supabase en la sesión
          historial.modelo = localStorage.getItem('user_modelo') || 'Cubo 3D (Tenis)';
          historial.color = localStorage.getItem('user_color') || '#0A58CA';
          historial.talla = localStorage.getItem('user_talla') || '26.0';
      }">

    <header class="w-full bg-white border-b border-gray-300 sticky top-0 z-50 px-4 py-4 flex items-center justify-between">
      <div class="text-xl font-bold"><a href="index.html"><span>Step</span><span class="text-primary">RA</span></a></div>
      
      <div class="flex items-center gap-4">
        <button @click="openProfile = true" class="flex items-center gap-1 bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg border border-gray-300 transition-all">
            <span class="material-symbols-outlined text-xl">account_circle</span>
            <span class="text-xs font-bold hidden sm:inline">Mi Perfil</span>
        </button>
        <button onclick="window.location.href='index.html'" class="text-gray-500 hover:text-dark-calzado"><span class="material-symbols-outlined text-2xl">home</span></button>
      </div>
    </header>

    <div x-show="openProfile" x-cloak class="fixed inset-0 z-50 flex justify-end bg-black/40 backdrop-blur-sm" @click.away="openProfile = false">
        <div class="bg-white w-full max-w-sm h-full p-6 shadow-2xl flex flex-col justify-between border-l border-gray-300" @click.stop>
            <div>
                <div class="flex justify-between items-center border-b pb-4 mb-6">
                    <h3 class="text-xl font-black uppercase tracking-wider text-dark-calzado">Configuración</h3>
                    <button @click="openProfile = false" class="text-gray-400 font-bold text-lg">✕</button>
                </div>

                <div class="bg-surface p-4 rounded-xl border border-gray-200 mb-6 flex flex-col gap-2">
                    <div class="text-xs font-bold text-gray-400 uppercase">Estado de la cuenta</div>
                    <template x-if="isLoggedIn">
                        <div class="text-sm font-bold text-green-700 flex items-center gap-1">🟢 Sesión Activa (Supabase Conectado)</div>
                    </template>
                    <template x-if="!isLoggedIn">
                        <div class="text-sm font-bold text-amber-700 flex items-center gap-1">🟡 Modo Invitado</div>
                    </template>
                </div>

                <div class="flex flex-col gap-3">
                    <h4 class="text-xs font-black uppercase text-gray-400 tracking-wider">Último Calzado Guardado</h4>
                    <template x-if="isLoggedIn">
                        <div class="bg-blue-50/60 p-4 rounded-xl border border-blue-200 flex flex-col gap-1.5">
                            <div class="text-sm font-bold text-dark-calzado">⚙️ Modelo: <span class="text-primary" x-text="historial.modelo"></span></div>
                            <div class="text-sm font-bold text-dark-calzado flex items-center gap-1.5">
                                🎨 Color: <div class="w-3 h-3 rounded-full border" :style="'background-color: ' + historial.color"></div>
                            </div>
                            <div class="text-sm font-bold text-dark-calzado">📏 Talla: <span class="text-primary" x-text="historial.talla + ' MX'"></span></div>
                        </div>
                    </template>
                    <template x-if="!isLoggedIn">
                        <div class="text-xs text-gray-500 italic p-4 bg-gray-50 rounded-xl border border-dashed border-gray-300">
                            No hay registros. Inicia sesión para sincronizar tus configuraciones con la base de datos de Supabase.
                        </div>
                    </template>
                </div>
            </div>

            <div class="border-t pt-4">
                <template x-if="isLoggedIn">
                    <button onclick="localStorage.removeItem('stepra_session'); window.location.reload();" class="w-full bg-red-600 text-white py-3 rounded-xl font-bold text-sm uppercase tracking-wider shadow">Cerrar Sesión</button>
                </template>
                <template x-if="!isLoggedIn">
                    <button onclick="window.location.href='login.html'" class="w-full bg-primary text-white py-3 rounded-xl font-bold text-sm uppercase tracking-wider shadow">Iniciar Sesión</button>
                </template>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full bg-background">
      <h2 class="text-2xl font-bold mb-6 text-center">Modelados Disponibles</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 justify-items-center">
        
        <div class="bg-white rounded-lg shadow border border-gray-300 overflow-hidden flex flex-col w-full max-w-sm cursor-pointer hover:shadow-md"
             @click="selectedProduct = { id: 'cubo', name: 'Cubo 3D (Tenis)', desc: 'Modelado plano calibrado para simulación de tenis deportivo.' }; openProductModal = true">
          <div class="h-44 bg-blue-50 flex items-center justify-center text-5xl">📦</div>
          <div class="p-6 bg-surface">
            <h3 class="text-xl font-bold">Cubo 3D (Tenis)</h3>
            <span class="text-lg font-bold text-primary mt-2 block">$150.00 MXN</span>
          </div>
        </div>

        <div class="bg-white rounded-lg shadow border border-gray-300 overflow-hidden flex flex-col w-full max-w-sm cursor-pointer hover:shadow-md"
             @click="selectedProduct = { id: 'cilindro', name: 'Cilindro 3D (Bota)', desc: 'Modelado alto calibrado para simulación de botas o calzado de caña alta.' }; openProductModal = true">
          <div class="h-44 bg-amber-50 flex items-center justify-center text-5xl">🛢️</div>
          <div class="p-6 bg-surface">
            <h3 class="text-xl font-bold">Cilindro 3D (Bota)</h3>
            <span class="text-lg font-bold text-primary mt-2 block">$180.00 MXN</span>
          </div>
        </div>

      </div>
    </main>

    <div x-show="openProductModal" x-cloak class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
      <div class="bg-white rounded-lg p-6 w-full max-w-md border border-gray-400 relative flex flex-col gap-4" @click.away="openProductModal = false">
        <button class="absolute top-4 right-4 text-gray-500 font-bold" @click="openProductModal = false">✕</button>
        <h3 class="text-2xl font-bold" x-text="selectedProduct?.name"></h3>
        <p class="text-sm text-gray-600" x-text="selectedProduct?.desc"></p>
        
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">Talla base:</label>
          <select x-model="selectedTalla" class="w-full border p-2 rounded bg-gray-50 font-bold text-primary">
            <option value="24.0">24.0 MX</option>
            <option value="25.0">25.0 MX</option>
            <option value="26.0">26.0 MX</option>
            <option value="27.0">27.0 MX</option>
            <option value="28.0">28.0 MX</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Color Inicial:</label>
          <div class="flex gap-4 justify-center">
            <button @click="selectedColor = '#0A58CA'" :class="selectedColor === '#0A58CA' ? 'ring-4 ring-primary' : ''" class="w-10 h-10 rounded-full bg-[#0A58CA] border"></button>
            <button @click="selectedColor = '#DC3545'" :class="selectedColor === '#DC3545' ? 'ring-4 ring-primary' : ''" class="w-10 h-10 rounded-full bg-[#DC3545] border"></button>
            <button @click="selectedColor = '#198754'" :class="selectedColor === '#198754' ? 'ring-4 ring-primary' : ''" class="w-10 h-10 rounded-full bg-[#198754] border"></button>
          </div>
        </div>

        <button @click="window.location.href = 'probador.html?modelo=' + selectedProduct.id + '&color=' + encodeURIComponent(selectedColor) + '&talla=' + selectedTalla;" 
                class="w-full bg-primary text-white py-3 rounded font-bold text-lg shadow hover:opacity-90 transition-all">
          Probar en mi Pie 👟
        </button>
      </div>
    </div>
</body>
</html>
