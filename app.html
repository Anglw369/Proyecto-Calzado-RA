<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>StepRA - Panel de Aplicación</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css?v=63">

    <script src="https://static.balsamiq.com/prototype/v1/js/tailwindcss-3.4.17.js"></script>
    <script defer src="https://static.balsamiq.com/prototype/v1/js/alpinejs-3.14.9.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a58ca",
                        "dark-calzado": "#0b1b3d",
                        "background": "#f3ede0",
                        "surface": "#f8f5ee",
                        "accent-light": "#ffd166"
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .ar-screen-fix {
            position: fixed; inset: 0; height: 100vh; height: 100dvh;
            width: 100%; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; background: #000;
        }
    </style>
</head>
<body class="bg-[#e6dfd3] text-dark-calzado antialiased min-h-screen" 
      x-data="{ subPage: localStorage.getItem('stepra_subpage') || 'catalog', isLoggedIn: localStorage.getItem('stepra_session') === 'active', openDropdown: false, selectedProduct: null, openProductModal: false, selectedTalla: '26.0', currentZapato: 'za1', currentTemporada: 'pri', currentVariante: '1', alertOpen: false, alertText: '', alertIcon: 'info', alertTitle: 'Notificación', fotoTomada: false }"
      x-init="
        if (subPage === 'ar_view') {
            currentZapato = localStorage.getItem('user_modelo') || 'za1';
            Alpine.nextTick(() => { encenderProbadorDesdeCatalogo(currentZapato, selectedTalla); });
        }
      ">

  <!-- MODAL DE ALERTA STEPRA PERSONALIZADO INTEGRADO -->
  <div x-show="alertOpen" x-cloak class="fixed inset-0 z-[99999] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
      <div class="bg-white rounded-2xl p-6 w-full max-w-sm border-2 border-gray-300 shadow-2xl text-center flex flex-col gap-4">
          <div class="w-12 h-12 bg-blue-50 text-primary rounded-full flex items-center justify-center mx-auto text-xl font-bold">
              <span class="material-symbols-outlined text-2xl" x-text="alertIcon">info</span>
          </div>
          <h4 class="text-xs font-black uppercase tracking-widest text-gray-400" x-text="alertTitle">Notificación</h4>
          <p class="text-sm font-medium text-dark-calzado whitespace-pre-line" x-text="alertText"></p>
          <button @click="alertOpen = false" class="w-full bg-primary text-white py-2.5 rounded-xl font-black text-xs uppercase tracking-wider shadow hover:opacity-95 transition-all">
              Continuar
          </button>
      </div>
  </div>

  <!-- VISTA A: EL CATÁLOGO -->
  <div x-show="subPage === 'catalog'" x-cloak class="min-h-screen flex flex-col bg-background">
    <header class="w-full bg-white border-b border-gray-300 sticky top-0 z-50 px-4 py-4 flex items-center justify-between">
      <div class="text-xl font-bold"><a href="index.html"><span>Step</span><span class="text-primary">RA</span></a></div>
      <div class="flex items-center gap-4">
        <button onclick="window.location.href='perfil.html'" class="flex items-center gap-1 bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg border border-gray-300 transition-all">
            <span class="material-symbols-outlined text-xl">account_circle</span>
            <span class="text-xs font-bold hidden sm:inline">Mi Perfil</span>
        </button>
        <button onclick="window.location.href='index.html'" class="text-gray-500 hover:text-dark-calzado"><span class="material-symbols-outlined text-2xl">home</span></button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
      <h2 class="text-2xl font-bold mb-6 text-center">Modelados Disponibles</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 justify-items-center">
        <div class="bg-white rounded-lg shadow border border-gray-300 overflow-hidden flex flex-col w-full max-w-sm cursor-pointer hover:shadow-md" @click="selectedProduct = { id: 'za1', name: 'Zapato Casual Z01', desc: 'Modelado plano calibrado para colecciones estacionales.' }; openProductModal = true">
          <div class="h-44 bg-blue-50 flex items-center justify-center text-5xl">👟</div>
          <div class="p-6 bg-surface"><h3 class="text-xl font-bold">Zapato Casual Z01</h3><span class="text-lg font-bold text-primary mt-2 block">$1,299.00 MXN</span></div>
        </div>
        <div class="bg-white rounded-lg shadow border border-gray-300 overflow-hidden flex flex-col w-full max-w-sm cursor-pointer hover:shadow-md" @click="selectedProduct = { id: 'za2', name: 'Zapato Ejecutivo Z02', desc: 'Línea estilizada premium con variantes adaptativas.' }; openProductModal = true">
          <div class="h-44 bg-amber-50 flex items-center justify-center text-5xl">🛢️</div>
          <div class="p-6 bg-surface"><h3 class="text-xl font-bold">Zapato Ejecutivo Z02</h3><span class="text-lg font-bold text-primary mt-2 block">$1,450.00 MXN</span></div>
        </div>
      </div>
    </main>

    <div x-show="openProductModal" x-cloak class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
      <div class="bg-white rounded-lg p-6 w-full max-w-md border border-gray-400 relative flex flex-col gap-4" @click.away="openProductModal = false">
        <button class="absolute top-4 right-4 text-gray-500 font-bold" @click="openProductModal = false">✕</button>
        <h3 class="text-2xl font-bold" x-text="selectedProduct?.name"></h3>
        <p class="text-sm text-gray-600" x-text="selectedProduct?.desc"></p>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">Talla base:</label>
          <select x-model="selectedTalla" class="w-full border p-2 rounded bg-gray-50 font-bold text-primary">
            <option value="25.0">25.0 MX</option>
            <option value="26.0">26.0 MX</option>
            <option value="27.0">27.0 MX</option>
          </select>
        </div>
        <button @click="openProductModal = false; subPage = 'ar_view'; currentZapato = selectedProduct.id; localStorage.setItem('stepra_subpage', 'ar_view'); localStorage.setItem('user_modelo', currentZapato); encenderProbadorDesdeCatalogo(currentZapato, selectedTalla);" 
                class="w-full bg-primary text-white py-3 rounded font-bold text-lg shadow hover:opacity-90 transition-all">
          Probar en mi Pie 👟
        </button>
      </div>
    </div>
  </div>

  <!-- VISTA B: EL PROBADOR VIRTUAL GLB -->
  <div x-show="subPage === 'ar_view'" x-cloak class="ar-screen-fix" :class="fotoTomada ? 'animate-ping duration-75' : ''">
    <div id="camera-container" class="relative flex-1 w-full bg-black overflow-hidden">
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>

        <div class="absolute top-3 left-3 right-3 z-30 bg-white/90 backdrop-blur pl-3 pr-2 py-1.5 rounded-xl shadow-xl flex items-center justify-between border border-white/25">
            <div class="flex-1 grid grid-cols-3 gap-1 items-center">
                <h3 class="col-span-3 text-[9px] font-black tracking-wider uppercase text-primary text-center border-b pb-0.5 border-blue-100">Escáner Pasarela - Modelos GLB</h3>
                <div class="flex flex-col items-center text-[10px] border-r border-gray-300 pr-1">
                    <span class="text-[8px] text-gray-400 font-bold uppercase">Silueta</span>
                    <span class="font-bold text-dark-calzado uppercase" x-text="currentZapato === 'za1' ? 'Z01' : 'Z02'"></span>
                </div>
                <div class="flex flex-col items-center text-[10px] border-r border-gray-300 pr-1">
                    <span class="text-[8px] text-gray-400 font-bold uppercase">Conjunto</span>
                    <span id="view-archivo-fbx" class="font-bold text-emerald-700 text-[9px] lowercase">cargando...</span>
                </div>
                <div class="flex flex-col items-center text-[10px]">
                    <span class="text-[8px] text-gray-400 font-bold uppercase">Talla</span>
                    <span id="view-talla" class="font-bold text-blue-700">26.0 MX</span>
                </div>
            </div>

            <div class="relative ml-2 shrink-0">
                <button @click="openDropdown = !openDropdown" 
                        class="h-10 w-10 rounded-lg bg-gray-100 hover:bg-gray-200 shadow-sm flex items-center justify-center text-dark-calzado border border-gray-300">
                    <i class="fa-solid" :class="openDropdown ? 'fa-xmark text-base text-red-600' : 'fa-bars text-sm'"></i>
                </button>

                <div x-show="openDropdown" x-cloak 
                     @click.away="openDropdown = false"
                     class="absolute right-0 top-12 bg-white/95 backdrop-blur-md rounded-xl shadow-2xl border border-gray-200 py-1.5 w-44 flex flex-col z-50">
                    
                    <a href="perfil.html" class="px-4 py-2.5 text-[11px] font-black uppercase text-dark-calzado hover:bg-gray-100 flex items-center gap-2 border-b border-gray-100 transition-colors">
                        <i class="fa-solid fa-user-astronaut text-primary text-xs"></i> Mi Perfil Premium
                    </a>
                    
                    <button @click="localStorage.removeItem('stepra_subpage'); subPage = 'catalog'; window.location.reload();" 
                            class="px-4 py-2.5 text-[11px] font-black uppercase text-left text-dark-calzado hover:bg-gray-100 flex items-center gap-2 transition-colors">
                        <i class="fa-solid fa-store text-emerald-600 text-xs"></i> Ir al Catálogo
                    </button>
                </div>
            </div>
        </div>

        <button onclick="window.capturarFotoProbador()" @click="fotoTomada = true; setTimeout(() => fotoTomada = false, 150)"
                class="absolute bottom-4 right-4 bg-white/90 text-dark-calzado border-2 border-gray-300 h-12 w-12 rounded-full shadow-2xl z-45 flex items-center justify-center active:scale-90 transition-all">
            <i class="fa-solid fa-camera text-base text-primary"></i>
        </button>
    </div>

    <div class="bg-white flex flex-col z-40 w-full shrink-0 border-t border-gray-300 shadow-2xl p-4 gap-3">
        <div class="grid grid-cols-3 gap-2 bg-gray-50 p-2 rounded-xl border border-gray-200">
            <div class="flex flex-col gap-1 col-span-2">
                <span class="text-[9px] font-black uppercase text-gray-400 tracking-wider">Estación / Temporada:</span>
                <div class="grid grid-cols-4 gap-1">
                    <button @click="currentTemporada = 'pri'; actualizarModeloFBXDynamico(currentZapato, currentTemporada, currentVariante);" :class="currentTemporada === 'pri' ? 'bg-primary text-white' : 'bg-white text-gray-600 border'" class="text-[10px] font-black uppercase py-1 rounded-md transition-all">Pri</button>
                    <button @click="currentTemporada = 've'; actualizarModeloFBXDynamico(currentZapato, currentTemporada, currentVariante);" :class="currentTemporada === 've' ? 'bg-primary text-white' : 'bg-white text-gray-600 border'" class="text-[10px] font-black uppercase py-1 rounded-md transition-all">Ver</button>
                    <button @click="currentTemporada = 'ot'; actualizarModeloFBXDynamico(currentZapato, currentTemporada, currentVariante);" :class="currentTemporada === 'ot' ? 'bg-primary text-white' : 'bg-white text-gray-600 border'" class="text-[10px] font-black uppercase py-1 rounded-md transition-all">Oto</button>
                    <button @click="currentTemporada = 'in'; actualizarModeloFBXDynamico(currentZapato, currentTemporada, currentVariante);" :class="currentTemporada === 'in' ? 'bg-primary text-white' : 'bg-white text-gray-600 border'" class="text-[10px] font-black uppercase py-1 rounded-md transition-all">Inv</button>
                </div>
            </div>
            
            <div class="flex flex-col gap-1">
                <span class="text-[9px] font-black uppercase text-gray-400 tracking-wider">Variante:</span>
                <select x-model="currentVariante" @change="actualizarModeloFBXDynamico(currentZapato, currentTemporada, currentVariante)" class="w-full bg-white border rounded-md p-1 font-black text-xs text-center text-primary h-[26px]">
                    <option value="1">Mod 1</option>
                    <option value="2">Mod 2</option>
                    <option value="3">Mod 3</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <button class="bg-[#f3ede0] border border-gray-300 py-2.5 rounded-xl text-[11px] font-bold uppercase flex items-center justify-center gap-1.5 transition-all active:scale-95" onclick="intercambiarEntreZ01yZ02()">
                <i class="fa-solid fa-arrows-rotate text-primary"></i> Cambiar Silueta (<span id="btn-label-silueta">Z01</span>)
            </button>
            <button class="bg-[#ffd166] text-dark-calzado border border-[#e6bd55] py-2.5 rounded-xl text-[11px] font-black uppercase flex items-center justify-center gap-1.5 transition-all active:scale-95 shadow-sm" onclick="simularMedicionIA()">
                <i class="fa-solid fa-ruler-combined"></i> Calibrar Talla
            </button>
        </div>
        
        <button class="w-full bg-primary text-white py-3.5 rounded-xl font-black text-sm uppercase tracking-wider shadow-md active:bg-[#08449E] transition-all" 
                @click="
                    localStorage.setItem('user_modelo', currentZapato);
                    localStorage.setItem('user_color', '#0a58ca');
                    localStorage.setItem('user_talla', window.tallaActual);
                    guardarConfiguracionActual();
                ">
            Guardar Configuración Real
        </button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <!-- CORRECCIÓN: Migración de motor global a MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script type="module" src="js/auth.js"></script>
  <script src="js/controllers.js?v=63"></script>
  <script src="js/main.js?v=63"></script>

  <script>
      document.addEventListener("DOMContentLoaded", () => {
          const dataCuerpo = document.body.__x_data;
          if (dataCuerpo && dataCuerpo.subPage === 'ar_view') {
              setTimeout(() => {
                  encenderProbadorDesdeCatalogo(dataCuerpo.currentZapato, dataCuerpo.selectedTalla);
              }, 300);
          }
      });

      function encenderProbadorDesdeCatalogo(idModelo, tallaBase) {
          window.tallaActual = parseFloat(tallaBase);
          window.modeloActual = idModelo; 
          
          const viewTalla = document.getElementById('view-talla');
          if (viewTalla) viewTalla.innerText = window.tallaActual.toFixed(1) + ' MX';
          
          const btnLabel = document.getElementById('btn-label-silueta');
          if(btnLabel) btnLabel.innerText = idModelo.toUpperCase();

          setTimeout(() => {
              if (typeof window.iniciarMotoresManuales === 'function') {
                  window.iniciarMotoresManuales();
                  window.actualizarModeloFBXDynamico(idModelo, 'pri', '1');
              } else {
                  console.error("Crítico: Los motores gráficos no están cargados en Window.");
              }
          }, 150);
      }

      function actualizarModeloFBXDynamico(zap, temp, varNum) {
          if (typeof window.cargarArchivoFBXReal === 'function') {
              window.cargarArchivoFBXReal(zap, temp, varNum);
          }
      }
  </script>
</body>
</html>
