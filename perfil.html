<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>StepRA - Mi Perfil Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://static.balsamiq.com/prototype/v1/js/tailwindcss-3.4.17.js"></script>
    <script defer src="https://static.balsamiq.com/prototype/v1/js/alpinejs-3.14.9.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a58ca",
                        "dark-calzado": "#0b1b3d",
                        "background": "#f3ede0",
                        "surface": "#f8f5ee"
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        /* Animación sutil estilo boutique digital */
        .premium-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .premium-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px rgba(11, 27, 61, 0.08);
        }
    </style>
</head>
<body class="bg-background text-dark-calzado antialiased min-h-screen flex flex-col"
      x-data="{ 
        isLoggedIn: localStorage.getItem('stepra_session') === 'active',
        configGuardada: {
            modelo: localStorage.getItem('user_modelo') || 'Ninguno',
            color: localStorage.getItem('user_color') || '#0A58CA',
            talla: localStorage.getItem('user_talla') || '0.0'
        },
        pedidoProcesado: false
      }">

    <!-- HEADER ESTILO SPORT -->
    <header class="w-full bg-white border-b border-gray-300 sticky top-0 z-50 py-4 px-6 flex items-center justify-between">
        <div class="text-xl font-bold uppercase tracking-widest">
            <a href="index.html"><span>Step</span><span class="text-primary">RA</span></a>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="localStorage.setItem('stepra_subpage', 'catalog'); window.location.href='app.html';" class="text-xs font-black uppercase tracking-wider text-primary hover:underline">
                <i class="fa-solid fa-arrow-left mr-1"></i> Volver al Catálogo
            </button>
        </div>
    </header>

    <!-- CUERPO DEL PERFIL PRESTIGE -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-8 flex flex-col gap-8">
        
        <!-- SECCIÓN DE BIENVENIDA -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-300 pb-6 gap-4">
            <div>
                <h1 class="text-3xl font-black uppercase tracking-tight">Mi Perfil Deportivo</h1>
                <p class="text-sm text-gray-500 mt-1">Sincronizado de forma segura con la base de datos de StepRA.</p>
            </div>
            <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-xl border border-gray-300 shadow-sm">
                <div class="w-2.5 h-2.5 rounded-full" :class="isLoggedIn ? 'bg-green-500' : 'bg-amber-500'"></div>
                <span class="text-xs font-black uppercase tracking-wider" x-text="isLoggedIn ? 'Miembro Premium' : 'Modo Invitado'"></span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- TARJETA DE DATOS DEL USUARIO -->
            <div class="bg-white p-6 rounded-2xl border border-gray-300 shadow-sm flex flex-col gap-4">
                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center text-2xl text-dark-calzado border border-gray-300">
                    <i class="fa-solid fa-user-astronaut"></i>
                </div>
                <div>
                    <h3 class="font-black uppercase text-xs text-gray-400 tracking-wider">Cuenta Activa</h3>
                    <p class="text-lg font-bold truncate">Usuario StepRA</p>
                </div>
                <hr class="border-gray-200">
                <button onclick="if(typeof window.cerrarSesionUsuario === 'function') { window.cerrarSesionUsuario(); } else { localStorage.clear(); sessionStorage.clear(); window.location.href='login.html'; }" 
                        class="w-full border-2 border-red-600 text-red-600 py-2.5 rounded-xl font-black text-xs uppercase tracking-widest hover:bg-red-50 transition-all">
                    Cerrar Sesión
                </button>
            </div>

            <!-- TARJETA CONFIGURACIÓN NIKE/ADIDAS VISUAL STYLE -->
            <div class="md:col-span-2 bg-white p-6 rounded-2xl border border-gray-300 shadow-sm flex flex-col justify-between gap-6 premium-card">
                <div>
                    <div class="flex justify-between items-center border-b pb-3 mb-4">
                        <h2 class="text-sm font-black uppercase tracking-widest text-primary"><i class="fa-solid fa-palette mr-1"></i> Diseño Guardado</h2>
                        <span class="text-[10px] font-bold text-gray-400 uppercase">Último Escaneo IA</span>
                    </div>

                    <!-- Layout Informativo de Calzado -->
                    <div class="grid grid-cols-2 gap-4" x-show="configGuardada.modelo !== 'Ninguno'">
                        <div class="flex flex-col gap-1">
                            <span class="text-[10px] uppercase font-bold text-gray-400">Silueta</span>
                            <span class="text-base font-black text-dark-calzado" x-text="configGuardada.modelo"></span>
                        </div>
                        <div class="flex flex-col gap-1">
                            <span class="text-[10px] uppercase font-bold text-gray-400">Talla Fijada</span>
                            <span class="text-base font-black text-dark-calzado" x-text="configGuardada.talla + ' MX'"></span>
                        </div>
                        <div class="col-span-2 flex flex-col gap-1.5">
                            <span class="text-[10px] uppercase font-bold text-gray-400">Color Escogido</span>
                            <div class="flex items-center gap-2">
                                <div class="w-5 h-5 rounded-full border border-black shadow-sm" :style="'background-color: ' + configGuardada.color"></div>
                                <span class="text-xs font-mono font-bold text-gray-600 uppercase" x-text="configGuardada.color"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Mensaje de Respaldo por si está vacío -->
                    <div class="text-center py-6 border-2 border-dashed border-gray-200 rounded-xl" x-show="configGuardada.modelo === 'Ninguno'">
                        <p class="text-xs text-gray-500 italic">No has guardado configuraciones AR desde el probador.</p>
                        <button onclick="localStorage.setItem('stepra_subpage', 'catalog'); window.location.href='app.html';" class="mt-3 text-xs bg-dark-calzado text-white px-4 py-2 rounded-lg font-bold">Ir a Probar</button>
                    </div>
                </div>

                <!-- SECCIÓN DE ACCIÓN DE COMPRA -->
                <div class="border-t pt-4" x-show="configGuardada.modelo !== 'Ninguno'">
                    <template x-if="!pedidoProcesado">
                        <button @click="pedidoProcesado = true" class="w-full bg-dark-calzado text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg hover:opacity-95 transition-all active:scale-95 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-bag-shopping"></i> Ordenar Calzado Personalizado
                        </button>
                    </template>
                    <template x-if="pedidoProcesado">
                        <div class="bg-emerald-50 border border-emerald-300 text-emerald-800 p-3 rounded-xl text-center text-xs font-bold flex items-center justify-center gap-2 animate-pulse">
                            <i class="fa-solid fa-circle-check text-base"></i> ¡Pedido Generado! Procesando orden en los talleres de León...
                        </div>
                    </template>
                </div>

            </div>
        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
