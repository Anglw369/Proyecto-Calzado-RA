<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>StepRA - Iniciar Sesión</title>
    <script src="https://static.balsamiq.com/prototype/v1/js/tailwindcss-3.4.17.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a58ca",
                        "dark-calzado": "#0b1b3d",
                        "background": "#f3ede0"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-dark-calzado antialiased min-h-screen flex flex-col">

    <header class="w-full bg-white border-b border-gray-300 py-4 px-6 flex items-center justify-between">
        <div class="text-xl font-bold">
            <a href="index.html"><span>Step</span><span class="text-primary">RA</span></a>
        </div>
        <a href="index.html" class="text-gray-500 font-bold hover:text-dark-calzado">Volver</a>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border border-gray-300 text-center">
            <h2 class="text-2xl font-bold mb-2">Bienvenido</h2>
            <p class="text-gray-500 mb-6">Ingresa tus credenciales para continuar</p>
            
            <form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
                <input type="email" id="login-email" placeholder="Correo electrónico" class="border border-gray-300 rounded px-4 py-3 bg-gray-50 focus:outline-none focus:border-primary w-full">
                <input type="password" id="login-password" placeholder="Contraseña" class="border border-gray-300 rounded px-4 py-3 bg-gray-50 focus:outline-none focus:border-primary w-full">
                
                <button type="button" onclick="ejecutarLoginLocal()" class="bg-primary text-white py-3 rounded font-bold shadow hover:opacity-90 transition-all w-full">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </main>

    <script>
        function ejecutarLoginLocal() {
            // Guardamos una bandera de sesión en el navegador
            localStorage.setItem("stepra_session", "active");
            // Mandamos al usuario directo a la aplicación
            window.location.href = "app.html";
        }
    </script>
</body>
</html>
