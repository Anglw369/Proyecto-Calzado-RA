<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>StepRA - Iniciar Sesión</title>
    <script src="https://static.balsamiq.com/prototype/v1/js/tailwindcss-3.4.17.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a58ca",
                        "dark-calzado": "#0b1b3d",
                        "background": "#f3ede0"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-dark-calzado antialiased min-h-screen flex flex-col">

    <header class="w-full bg-white border-b border-gray-300 py-4 px-6 flex items-center justify-between">
        <div class="text-xl font-bold">
            <a href="index.html"><span>Step</span><span class="text-primary">RA</span></a>
        </div>
        <a href="index.html" class="text-gray-500 font-bold hover:text-dark-calzado">Volver</a>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border border-gray-300 text-center">
            <h2 class="text-2xl font-bold mb-2">Bienvenido</h2>
            <p class="text-gray-500 mb-6">Ingresa tus credenciales para continuar</p>
            
            <form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
                <input type="email" id="login-email" placeholder="Correo electrónico" class="border border-gray-300 rounded px-4 py-3 bg-gray-50 focus:outline-none focus:border-primary w-full">
                <input type="password" id="login-password" placeholder="Contraseña" class="border border-gray-300 rounded px-4 py-3 bg-gray-50 focus:outline-none focus:border-primary w-full">
                
                <!-- Este botón ahora llama con total seguridad a la función global expuesta por el módulo de Supabase -->
                <button type="button" onclick="if(typeof window.loginUsuario === 'function') { window.loginUsuario(document.getElementById('login-email').value, document.getElementById('login-password').value); } else { console.error('El módulo auth.js aún no se ha cargado.'); }" class="bg-primary text-white py-3 rounded font-bold shadow hover:opacity-90 transition-all w-full">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </main>

    <!-- MODAL DE ALERTA STEPRA PERSONALIZADO PARA INTERCEPTAR ALERT() NATIVOS -->
    <div id="stepra-custom-alert" class="fixed inset-0 z-[99999] hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm border-2 border-gray-300 shadow-2xl text-center flex flex-col gap-4">
            <div class="w-12 h-12 bg-blue-50 text-primary rounded-full flex items-center justify-center mx-auto text-xl font-bold">
                <span class="material-symbols-outlined text-2xl" id="alert-icon-type">lock</span>
            </div>
            <h4 class="text-xs font-black uppercase tracking-widest text-gray-400" id="alert-title-text">Sincronización</h4>
            <p class="text-sm font-medium text-dark-calzado whitespace-pre-line" id="alert-message-text"></p>
            <button onclick="cerrarAlertaYRedirigir()" class="w-full bg-primary text-white py-2.5 rounded-xl font-black text-xs uppercase tracking-wider shadow hover:opacity-95 transition-all">
                Continuar
            </button>
        </div>
    </div>

    <!-- INYECTOR ESTÉTICO DE ALERTAS -->
    <script>
        let urlDestinoFinal = "app.html";

        window.alert = function(mensaje) {
            const alertModal = document.getElementById('stepra-custom-alert');
            const alertMessage = document.getElementById('alert-message-text');

            if (alertModal && alertMessage) {
                alertMessage.innerText = mensaje;
                alertModal.style.display = 'flex';
            } else {
                // Caída de respaldo por si el DOM no ha cargado completamente
                window.alertNative(mensaje);
            }
        };
        // Guardamos copia de respaldo nativa por seguridad
        window.alertNative = window.alertNative || alert;

        function cerrarAlertaYRedirigir() {
            window.location.href = urlDestinoFinal;
        }
    </script>

    <!-- TRUCO DE CONEXIÓN MODULAR: Forzamos la carga del archivo auth como módulo para que Supabase responda -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
